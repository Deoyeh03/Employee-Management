services:
  - type: web
    name: employee-management-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: employee-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: employee-management-db
    databaseName: antigravity
    plan: free
